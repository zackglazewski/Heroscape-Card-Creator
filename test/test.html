<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal Menu Bar</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .navbar {
            display: flex;
            background-color: #333;
            overflow: hidden;
            justify-content: space-around; /* Space out the menu items */
        }

        .navbar a {
            text-align: center;
            padding: 14px 20px;
            margin: 0 10px; /* Add margin to ensure space around buttons */
            text-decoration: none;
            color: white;
            display: block;
            min-width: 80px; /* Minimum width for buttons */
        }

        .navbar a:hover {
            background-color: #ddd;
            color: black;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="#contact">Contact</a>
    </div>
</body>
</html>
