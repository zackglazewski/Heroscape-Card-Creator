<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Uploader to Canvas with Transform Controls</title>
    <style>
        #canvasContainer {
            text-align: center;
            margin-top: 20px;
            position: relative;
        }
        canvas {
            border: 1px solid black;
        }
        .controls {
            margin: 10px 0;
            text-align: center;
        }
        .controls label {
            margin: 0 10px;
        }
        .sortable-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        .sortable-list li {
            padding: 5px;
            margin: 5px 0;
            background-color: #f0f0f0;
            cursor: move;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid transparent;
            border-radius: 5px;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .sortable-list li.selected {
            background-color: #d0eaff;
            border-color: #007bff;
        }
        .sortable-list li:hover {
            background-color: #e0e0e0;
        }
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>
</head>
<body>
    <h1>Image Uploader to Canvas with Transform Controls</h1>
    <input type="file" id="imageUploader" accept="image/*" multiple>
    
    <div class="controls">
        <button id="decreaseScale">Decrease Scale</button>
        <button id="increaseScale">Increase Scale</button>
    </div>
    
    <div id="canvasContainer">
        <canvas id="myCanvas" width="800" height="600"></canvas>
    </div>
    
    <div>
        <h2>Images Render Order</h2>
        <ul id="imageList" class="sortable-list"></ul>
    </div>

    <script>
        const imageUploader = document.getElementById('imageUploader');
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');
        const increaseScale = document.getElementById('increaseScale');
        const decreaseScale = document.getElementById('decreaseScale');
        const imageList = document.getElementById('imageList');
        
        let currentImg = new Image();
        let imgX = 0;
        let imgY = 0;
        let scale = 1;
        let isDragging = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        let selectedImageIndex = -1;

        let imagesToPlace = [];

        imageUploader.addEventListener('change', (event) => {
            const files = event.target.files;
            if (files.length > 0) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const newImg = new Image();
                    newImg.onload = () => {
                        currentImg = newImg;
                        
                        
                        const aspectRatio = currentImg.width / currentImg.height;

                        currentImg.width = canvas.width / 2;
                        currentImg.height = currentImg.width / aspectRatio;

                        imgX = canvas.width / 2;
                        imgY = canvas.height / 2;
                        imagesToPlace.push({img: currentImg, x: imgX, y: imgY, scale: scale, aspectRatio: aspectRatio, name: files[0].name});
                        updateImageList();
                        drawAllImages();
                        resetControls();
                        // Automatically select the uploaded image
                        selectImage(imagesToPlace.length - 1, { offsetX: imgX, offsetY: imgY });
                        // Clear the file input
                        imageUploader.value = "";
                    };
                    newImg.src = e.target.result;
                };
                reader.readAsDataURL(files[0]);
            }
        });

        increaseScale.addEventListener('click', () => {
            adjustScale(1);
        });

        decreaseScale.addEventListener('click', () => {
            adjustScale(-1);
        });

        function adjustScale(delta) {
            if (selectedImageIndex >= 0) {
                const image = imagesToPlace[selectedImageIndex];
                image.scale = Math.max(0.1, image.scale + (delta*0.1));

                drawAllImages();
            }
        }

        function drawAllImages() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);  // Clear the canvas
            imagesToPlace.forEach(image => {
                const {img, x, y, scale, aspectRatio} = image;
                const newWidth = img.width * scale;
                console.log("width: " + img.width)
                console.log("adjusted width: " + newWidth);
                const newHeight = newWidth / aspectRatio;
                ctx.drawImage(img, x - (newWidth / 2), y - (newHeight / 2), newWidth, newHeight);
            });
        }

        function resetControls() {
            scale = 1;
        }

        function updateImageList() {
            imageList.innerHTML = '';
            imagesToPlace.forEach((image, index) => {
                const li = document.createElement('li');
                li.textContent = image.name;
                li.setAttribute('data-index', index);
                li.addEventListener('mousedown', (e) => selectImage(index, e));
                
                const removeButton = document.createElement('button');
                removeButton.textContent = 'Remove';
                removeButton.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeImage(index);
                });
                
                li.appendChild(removeButton);
                imageList.appendChild(li);
            });

            new Sortable(imageList, {
                onEnd: function (evt) {
                    const movedItem = imagesToPlace.splice(evt.oldIndex, 1)[0];
                    imagesToPlace.splice(evt.newIndex, 0, movedItem);
                    drawAllImages();
                }
            });
        }

        function selectImage(index, e) {
            selectedImageIndex = index;
            const image = imagesToPlace[index];
            imgX = image.x;
            imgY = image.y;
            scale = image.scale;
            currentImg = image.img;
            drawAllImages();
            dragOffsetX = e.offsetX - imgX;
            dragOffsetY = e.offsetY - imgY;

            const listItems = imageList.getElementsByTagName('li');
            for (let item of listItems) {
                item.classList.remove('selected');
            }
            const selectedItem = listItems[index];
            selectedItem.classList.add('selected');
        }

        function removeImage(index) {
            imagesToPlace.splice(index, 1);
            updateImageList();
            drawAllImages();
        }

        canvas.addEventListener('mousedown', (e) => {
            if (selectedImageIndex >= 0) {

                const image = imagesToPlace[selectedImageIndex];
                isDragging = true;
                dragOffsetX = e.offsetX - image.x;
                dragOffsetY = e.offsetY - image.y;
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging && selectedImageIndex >= 0) {
                const image = imagesToPlace[selectedImageIndex];
                imgX = e.offsetX - dragOffsetX;
                imgY = e.offsetY - dragOffsetY;
                image.x = imgX;
                image.y = imgY;
                drawAllImages();
            }
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
        });

        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
        });
    </script>
</body>
</html>
