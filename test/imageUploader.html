<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Uploader to Canvas with Transform Controls</title>
    <style>
        #canvasContainer {
            text-align: center;
            margin-top: 20px;
        }
        canvas {
            border: 1px solid black;
        }
        .controls {
            margin: 10px 0;
            text-align: center;
        }
        .controls label {
            margin: 0 10px;
        }
    </style>
</head>
<body>
    <h1>Image Uploader to Canvas with Transform Controls</h1>
    <input type="file" id="imageUploader" accept="image/*" multiple>
    
    <div class="controls">
        <label>Scale: <input type="range" id="scaleRange" min="0.1" max="3" step="0.1" value="1"></label>
        <button id="moveLeft">←</button>
        <button id="moveUp">↑</button>
        <button id="moveRight">→</button>
        <button id="moveDown">↓</button>
        <button id="placeImage">Place Image</button>
    </div>
    
    <div id="canvasContainer">
        <canvas id="myCanvas" width="800" height="600"></canvas>
    </div>

    <script>
        const imageUploader = document.getElementById('imageUploader');
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');
        const scaleRange = document.getElementById('scaleRange');
        const moveLeft = document.getElementById('moveLeft');
        const moveUp = document.getElementById('moveUp');
        const moveRight = document.getElementById('moveRight');
        const moveDown = document.getElementById('moveDown');
        const placeImage = document.getElementById('placeImage');
        
        let currentImg = new Image();
        let imgX = 0;
        let imgY = 0;
        let scale = 1;

        let imagesToPlace = [];

        imageUploader.addEventListener('change', (event) => {
            const files = event.target.files;
            if (files.length > 0) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const newImg = new Image();
                    newImg.onload = () => {
                        currentImg = newImg;
                        imgX = canvas.width / 2 - currentImg.width / 2;
                        imgY = canvas.height / 2 - currentImg.height / 2;
                        drawImage();
                    };
                    newImg.src = e.target.result;
                };
                reader.readAsDataURL(files[0]);
            }
        });

        scaleRange.addEventListener('input', () => {
            scale = scaleRange.value;
            drawImage();
        });

        moveLeft.addEventListener('click', () => {
            imgX -= 10;
            drawImage();
        });

        moveUp.addEventListener('click', () => {
            imgY -= 10;
            drawImage();
        });

        moveRight.addEventListener('click', () => {
            imgX += 10;
            drawImage();
        });

        moveDown.addEventListener('click', () => {
            imgY += 10;
            drawImage();
        });

        placeImage.addEventListener('click', () => {
            imagesToPlace.push({img: currentImg, x: imgX, y: imgY, scale: scale});
            drawAllImages();
            resetControls();
        });

        function drawImage() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);  // Clear the canvas
            drawAllImages();
            ctx.drawImage(currentImg, imgX, imgY, currentImg.width * scale, currentImg.height * scale);
        }

        function drawAllImages() {
            imagesToPlace.forEach(image => {
                const {img, x, y, scale} = image;
                ctx.drawImage(img, x, y, img.width * scale, img.height * scale);
            });
        }

        function resetControls() {
            scaleRange.value = 1;
            scale = 1;
        }
    </script>
</body>
</html>
